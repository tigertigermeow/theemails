<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOIA Mail Archives - Public Records Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#15803d',
              600: '#166534',
              700: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.6); }
    .mark-highlight {
      background-color: #fef08a;
      color: #713f12;
      padding: 0 2px;
      border-radius: 2px;
    }
    .dark .mark-highlight {
      background-color: #854d0e;
      color: #fef08a;
    }
    @media print {
      body * { visibility: hidden; }
      #printable-pane, #printable-pane * { visibility: visible; }
      #printable-pane {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
        background: white !important;
        color: black !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col font-sans transition-colors duration-150 overflow-hidden select-none">

  <!-- TOP HEADER / NAV -->
  <header class="no-print h-14 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur px-4 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-bold shadow-sm">
        <i data-lucide="archive" class="w-4 h-4"></i>
      </div>
      <div>
        <h1 class="text-sm font-semibold tracking-tight flex items-center gap-2">
          FOIA Records Webmail
          <span class="text-[10px] font-mono uppercase px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 font-bold border border-emerald-300 dark:border-emerald-800">Static Vault</span>
        </h1>
        <p class="text-[11px] text-slate-500 dark:text-slate-400">RFC 5322 Unclassified Release Explorer</p>
      </div>
    </div>

    <!-- Actions & Global Utilities -->
    <div class="flex items-center gap-2">
      <!-- File input hidden for upload -->
      <input type="file" id="file-uploader" class="hidden" accept=".json,.eml" multiple>
      <button onclick="document.getElementById('file-uploader').click()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-colors shadow-sm">
        <i data-lucide="upload" class="w-3.5 h-3.5 text-emerald-600"></i>
        <span>Import JSON / .EML</span>
      </button>

      <button onclick="exportCurrentSelection()" title="Export current list to JSON" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-colors shadow-sm">
        <i data-lucide="download" class="w-3.5 h-3.5 text-slate-500"></i>
        <span class="hidden sm:inline">Export</span>
      </button>

      <div class="h-4 w-px bg-slate-200 dark:bg-slate-800 mx-1"></div>

      <!-- Theme Switcher -->
      <button onclick="toggleTheme()" class="p-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition-colors" title="Toggle Theme">
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
      </button>
    </div>
  </header>

  <!-- MAIN THREE-PANE CONTAINER -->
  <div class="flex-1 flex overflow-hidden">

    <!-- 1. SIDEBAR (Navigation, Categories, Senders) -->
    <aside class="no-print w-64 border-r border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-900/50 flex flex-col shrink-0">
      
      <!-- Folders & Quick Filters -->
      <div class="p-3">
        <div class="text-[11px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider px-2 mb-2">Folders</div>
        <nav class="space-y-0.5 text-xs">
          <button onclick="
